name: Build Desktop App

# Tauri can't cross-compile to Windows from macOS (needs the MSVC linker +
# WebView2, neither available on this Mac), so producing a real .exe/.msi
# requires this CI matrix rather than a local build step. Trigger manually
# from the Actions tab, or push a tag like "app-v0.1.0" to also cut a draft
# GitHub Release with every installer attached.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

# New repos default the GITHUB_TOKEN to read-only, which makes
# tauri-action's release-creation step fail with "Resource not accessible
# by integration" — this grants the write scope releases need.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build and (on tag push) publish a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Aeon Desktop v__VERSION__"
          releaseBody: "See the assets below to download this version for your platform."
          # Published (not draft): GitHub's public "latest release" API — what
          # the site's /download page reads to link installers — never
          # returns draft releases, so a draft here would leave that page
          # stuck on "no build published yet" even after a successful build.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
